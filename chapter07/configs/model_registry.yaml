models:
  demucs:
    required_package: demucs
    default_model: htdemucs_ft
    modes: [2stems, 4stems, 6stems]
    notes: "Default executable family; also uses mdx_extra_q for a lighter comparison."
  torchaudio_hdemucs:
    required_package: torchaudio
    default_model: HDEMUCS_HIGH_MUSDB_PLUS
    modes: [4stems]
    notes: "Official PyTorch/Torchaudio source-separation bundle."
  openunmix:
    required_package: openunmix
    default_model: umxhq
    modes: [4stems]
  spleeter:
    required_package: spleeter
    default_model: spleeter:2stems
    modes: [2stems, 4stems, 5stems]
    notes: "Optional historical U-Net baseline; dependency stack can be fragile."
  audio_separator_bs_roformer:
    required_package: audio_separator
    default_model: model_bs_roformer_ep_317_sdr_12.9755.ckpt
    modes: [2stems]
    notes: "Executable RoFormer-family checkpoint through audio-separator/UVR."
  audio_separator_melband_roformer:
    required_package: audio_separator
    default_model: melband_roformer_big_beta4.ckpt
    modes: [2stems]
    notes: "Executable Mel-RoFormer / MelBand RoFormer checkpoint through audio-separator/UVR."
  roformer:
    required_package: null
    default_model: optional_checkpoint
    modes: [2stems, 4stems]
    notes: "Optional structure/runner only; not a default dependency."
